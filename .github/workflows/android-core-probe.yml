name: Android AppleWin core probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".gitmodules"
      - "android/applewin-core"
      - "android/app-shell/**"
      - ".github/workflows/android-core-probe.yml"

permissions:
  contents: read

jobs:
  build-arm64-core:
    name: Build AppleWin libretro core for Android ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Check out AppleWinDroid and its core source
        uses: actions/checkout@v4

      - name: Check out the AppleWin core submodule
        run: git submodule update --init android/applewin-core

      - name: Enforce casual-only Android achievements
        run: |
          if rg -ni 'hard.?core' android/app-shell/java android/app-shell/native; then
            echo "Android achievements must remain casual/softcore only."
            exit 1
          fi

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev pkg-config xxd ripgrep

      - name: Install Android NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK and CMake packages
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure ARM64 core
        run: |
          # AppleWin's Linux port currently asks pkg-config for host zlib. Use
          # CMake's Android-aware finder so the NDK sysroot supplies zlib.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          boost_headers = Path(os.environ["RUNNER_TEMP"]) / "boost-include"
          ndk_zlib = Path(os.environ["ANDROID_HOME"]) / "ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libz.so"
          shutil.copytree("/usr/include/boost", boost_headers / "boost")

          source_path = Path("android/applewin-core/source/CMakeLists.txt")
          source = source_path.read_text()
          source = source.replace(
              "pkg_search_module(ZLIB REQUIRED zlib)",
              "find_package(ZLIB REQUIRED)",
              1,
          )
          source = source.replace(
              "find_package(Boost REQUIRED)",
              f'set(Boost_INCLUDE_DIRS "{boost_headers}")',
          )
          source_path.write_text(source)

          common_path = Path("android/applewin-core/source/frontends/common2/CMakeLists.txt")
          common = common_path.read_text().replace(
              "find_package(Boost REQUIRED)",
              f'set(Boost_INCLUDE_DIRS "{boost_headers}")',
          )
          common_path.write_text(common)

          libretro_path = Path("android/applewin-core/source/frontends/libretro/CMakeLists.txt")
          libretro = libretro_path.read_text()
          # Android's linker needs the shared-object dependency name recorded
          # in the JNI bridge to match the APK's native library filename.
          # AppleWin's default libretro target has no "lib" prefix, which
          # produces a JNI dependency that Android cannot resolve.
          target_properties = 'set_target_properties(applewin_libretro PROPERTIES PREFIX "lib")'
          if target_properties not in libretro:
              libretro += chr(10) + target_properties + chr(10)
          include_block = "target_include_directories(applewin_libretro PRIVATE" + chr(10) + "  libretro-common/include"
          libretro = libretro.replace(
              include_block,
              include_block + chr(10) + f"  {boost_headers}",
              1,
          )
          link_block = "target_link_libraries(applewin_libretro PRIVATE" + chr(10) + "  appleii" + chr(10) + "  common2"
          libretro = libretro.replace(
              link_block,
              link_block + chr(10) + f"  {ndk_zlib}",
              1,
          )
          libretro_path.write_text(libretro)

          # Include the floppy image detector's error code in the Android
          # in-app diagnostic log when a supported core rejects a disk.
          diskcontrol_path = Path("android/applewin-core/source/frontends/libretro/diskcontrol.cpp")
          diskcontrol = diskcontrol_path.read_text()
          rejection_log = '            ra2::log_cb(RETRO_LOG_ERROR, "Android diagnostic: floppy image rejected, ImageError=%d, path=%s\\n", static_cast<int>(error), path.c_str());'
          failure_anchor = "            }\n        }\n\n        return false;"
          if rejection_log not in diskcontrol:
              diskcontrol = diskcontrol.replace(
                  failure_anchor,
                  "            }\n" + rejection_log + "\n        }\n\n        return false;",
                  1,
              )
          diskcontrol_path.write_text(diskcontrol)

          # Android's executable lives under /system/bin, not next to the
          # AppleWin source tree. Avoid canonical() on a nonexistent install
          # root so the embedded-ROM libretro frontend can start normally.
          gnuframe_path = Path("android/applewin-core/source/frontends/common2/gnuframe.cpp")
          gnuframe = gnuframe_path.read_text()
          old_root_lookup = chr(10).join([
              "        if (std::filesystem::exists(executable))",
              "        {",
              "            const auto root = std::filesystem::canonical(executable.parent_path() / ROOT_PATH);",
              "            paths.push_back(root);",
              "        }",
              "",
          ])
          new_root_lookup = chr(10).join([
              "        if (std::filesystem::exists(executable))",
              "        {",
              "            const auto rootPath = executable.parent_path() / ROOT_PATH;",
              "            if (std::filesystem::exists(rootPath))",
              "            {",
              "                paths.push_back(std::filesystem::canonical(rootPath));",
              "            }",
              "        }",
              "",
          ])
          if old_root_lookup in gnuframe:
              gnuframe = gnuframe.replace(old_root_lookup, new_root_lookup, 1)
          elif new_root_lookup not in gnuframe:
              raise RuntimeError("Could not patch AppleWin resource root lookup")
          gnuframe_path.write_text(gnuframe)

          root_cmake_path = Path("android/applewin-core/CMakeLists.txt")
          root_cmake = root_cmake_path.read_text()
          native_subdir = 'add_subdirectory("${CMAKE_CURRENT_LIST_DIR}/../app-shell/native" app-shell-native)'
          if native_subdir not in root_cmake:
              root_cmake_path.write_text(root_cmake + chr(10) + native_subdir + chr(10))
          PY
          cmake -S android/applewin-core -B build-android-core \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_APPLEN=OFF \
            -DBUILD_QAPPLE=OFF \
            -DBUILD_SA2=OFF \
            -DBUILD_LIBRETRO=ON \
            -DENABLE_NETWORKING=OFF

      - name: Compile libretro core
        run: cmake --build build-android-core --target applewin_libretro applewindroid_jni --parallel 2

      - name: Assemble and verify native APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
          export PATH="$BUILD_TOOLS:$PATH"
          export SDK_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export APP_KEY_DIR="$RUNNER_TEMP/applewindroid-keys"
          mkdir -p "$RUNNER_TEMP/native-libs/arm64-v8a"
          CORE_SO=$(find build-android-core -name libapplewin_libretro.so -print -quit)
          JNI_SO=$(find build-android-core -name libapplewindroid_jni.so -print -quit)
          test -n "$CORE_SO" && test -n "$JNI_SO"
          readelf -d "$JNI_SO" | grep -F 'libapplewin_libretro.so'
          cp "$CORE_SO" "$RUNNER_TEMP/native-libs/arm64-v8a/libapplewin_libretro.so"
          cp "$JNI_SO" "$RUNNER_TEMP/native-libs/arm64-v8a/libapplewindroid_jni.so"
          bash android/app-shell/build-apk-with-native.sh "$RUNNER_TEMP/native-libs/arm64-v8a"

      - name: Upload verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleWinDroid-Android-arm64-apk
          path: android/app-shell/build/app.apk
          if-no-files-found: error
          retention-days: 30
