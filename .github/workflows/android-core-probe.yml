name: Android AppleWin core probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".gitmodules"
      - "android/applewin-core"
      - "android/app-shell/**"
      - ".github/workflows/android-core-probe.yml"

permissions:
  contents: read

jobs:
  build-arm64-core:
    name: Build AppleWin libretro core for Android ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Check out AppleWinDroid and its core source
        uses: actions/checkout@v4

      - name: Check out the AppleWin core submodule
        run: git submodule update --init android/applewin-core

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev pkg-config xxd

      - name: Install Android NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK and CMake packages
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Configure ARM64 core
        run: |
          # AppleWin's Linux port currently asks pkg-config for host zlib. Use
          # CMake's Android-aware finder so the NDK sysroot supplies zlib.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          boost_headers = Path(os.environ["RUNNER_TEMP"]) / "boost-include"
          ndk_zlib = Path(os.environ["ANDROID_HOME"]) / "ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libz.so"
          shutil.copytree("/usr/include/boost", boost_headers / "boost")

          source_path = Path("android/applewin-core/source/CMakeLists.txt")
          source = source_path.read_text()
          source = source.replace(
              "pkg_search_module(ZLIB REQUIRED zlib)",
              "find_package(ZLIB REQUIRED)",
              1,
          )
          source = source.replace(
              "find_package(Boost REQUIRED)",
              f'set(Boost_INCLUDE_DIRS "{boost_headers}")',
          )
          source_path.write_text(source)

          common_path = Path("android/applewin-core/source/frontends/common2/CMakeLists.txt")
          common = common_path.read_text().replace(
              "find_package(Boost REQUIRED)",
              f'set(Boost_INCLUDE_DIRS "{boost_headers}")',
          )
          common_path.write_text(common)

          libretro_path = Path("android/applewin-core/source/frontends/libretro/CMakeLists.txt")
          libretro = libretro_path.read_text()
          include_block = "target_include_directories(applewin_libretro PRIVATE" + chr(10) + "  libretro-common/include"
          libretro = libretro.replace(
              include_block,
              include_block + chr(10) + f"  {boost_headers}",
              1,
          )
          link_block = "target_link_libraries(applewin_libretro PRIVATE" + chr(10) + "  appleii" + chr(10) + "  common2"
          libretro = libretro.replace(
              link_block,
              link_block + chr(10) + f"  {ndk_zlib}",
              1,
          )
          libretro_path.write_text(libretro)

          root_cmake_path = Path("android/applewin-core/CMakeLists.txt")
          root_cmake = root_cmake_path.read_text()
          native_subdir = 'add_subdirectory("${CMAKE_CURRENT_LIST_DIR}/../app-shell/native" app-shell-native)'
          if native_subdir not in root_cmake:
              root_cmake_path.write_text(root_cmake + chr(10) + native_subdir + chr(10))
          PY
          cmake -S android/applewin-core -B build-android-core \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_APPLEN=OFF \
            -DBUILD_QAPPLE=OFF \
            -DBUILD_SA2=OFF \
            -DBUILD_LIBRETRO=ON \
            -DENABLE_NETWORKING=OFF

      - name: Compile libretro core
        run: cmake --build build-android-core --target applewin_libretro applewindroid_jni --parallel 2
